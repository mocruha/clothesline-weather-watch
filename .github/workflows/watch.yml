name: watch

on:
  schedule:
    # UTC (America/Sao_Paulo = UTC-3). Dois ticks/hora: o scheduler do GitHub
    # engole ticks (já engoliu 20h seguidas em 2026-11-26); o dedup por chave
    # `report:{dia}` impede relatório duplicado, então redundância é barata.
    - cron: "15 * * * *" # 09-10h local = 12-13h UTC, 16-17h = 19-20h UTC
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Enviar os relatórios mesmo fora das janelas 09-10h/16-17h"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run watch --once ${{ inputs.force_report && '--force-report' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}