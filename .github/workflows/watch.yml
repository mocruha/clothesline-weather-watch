name: watch

on:
  schedule:
    - cron: "15 * * * *" # UTC; 09-10h local = 12-13h UTC
  workflow_dispatch:
    inputs:
      force_report:
        description: "Enviar o relatório mesmo fora da janela 09-10h"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run watch --once ${{ inputs.force_report && '--force-report' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}